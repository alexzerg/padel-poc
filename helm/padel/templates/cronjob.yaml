{{- if .Values.scraper.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "padel.fullname" . }}-scraper
  labels:
    {{- include "padel.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scraper.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: {{ .Values.scraper.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: {{ include "padel.name" . }}
            app.kubernetes.io/component: scraper
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: scraper
              image: "{{ .Values.scraper.image.repository }}:{{ .Values.scraper.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: API_INGEST
                  value: "http://{{ include "padel.fullname" . }}/api/ingest"
                - name: DAYS_AHEAD
                  value: {{ .Values.scraper.daysAhead | quote }}
                - name: CENTER_COORD
                  value: {{ .Values.scraper.centerCoord | quote }}
                - name: RADIUS_MILES
                  value: {{ .Values.scraper.radiusMiles | quote }}
                - name: SETTLE_MS
                  value: {{ .Values.scraper.settleMs | quote }}
              resources:
                {{- toYaml .Values.scraper.resources | nindent 16 }}
{{- if .Values.scraper.mountCode }}
              volumeMounts:
                - name: scraper-code
                  mountPath: /srv/app/data/clubs.json
                  subPath: clubs.json
                - name: scraper-code
                  mountPath: /srv/scrape.py
                  subPath: scrape.py
          volumes:
            - name: scraper-code
              configMap:
                name: {{ include "padel.fullname" . }}-scraper-code
{{- end }}
{{- end }}
